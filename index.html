:root {
  --paper: #F2E8D5;
  --blue: #1D2B6B;
  --deep: #141C4A;
  --gold: #F2A922;
  --rose: #EE5E7B;
  /* The scene is drawn on a portrait unit: the screen's width, or 56% of its height on wide screens. */
  --s: min(100vw, 56vh);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--blue); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  color: var(--paper);
  font-family: "NH Grotesk", system-ui, sans-serif;
  font-weight: 800;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* Words sit in the sky, to the right of her neck. */
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui section {
  position: absolute;
  left: calc(var(--s) * 0.46);
  width: min(max(calc(var(--s) * 0.5), 14.5rem), calc(100vw - var(--s) * 0.46 - 0.6rem));
  padding-right: env(safe-area-inset-right);
}
#ui button { pointer-events: auto; }
p { margin: 0; }

#title { top: 30%; }
h1 {
  margin: 0;
  font-size: calc(var(--s) * 0.215);
  line-height: 0.84;
  letter-spacing: -0.035em;
}
h1 em {
  display: block;
  font-family: "NH Serif", Georgia, serif;
  font-weight: 400;
  font-size: 1.24em;
  letter-spacing: -0.02em;
  color: var(--gold);
}
.line {
  margin-top: calc(var(--s) * 0.06);
  font-size: max(0.82rem, calc(var(--s) * 0.046));
  line-height: 1.22;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border-radius: 0;
  background: none;
}
#start, #again {
  margin-top: calc(var(--s) * 0.06);
  padding: 0.78em 1.05em 0.72em;
  font-size: max(0.86rem, calc(var(--s) * 0.046));
  border: 2px solid currentColor;
}
#start:hover, #start:focus-visible { background: var(--paper); color: var(--blue); outline: none; }
.note {
  margin-top: calc(var(--s) * 0.035);
  font-size: max(0.7rem, calc(var(--s) * 0.031));
  line-height: 1.3;
  opacity: 0.72;
}
.quiet {
  margin-top: calc(var(--s) * 0.045);
  padding: 0.3em 0;
  font-size: max(0.74rem, calc(var(--s) * 0.034));
  border: 0;
  border-bottom: 1.5px solid currentColor;
}
.quiet:hover, .quiet:focus-visible { color: var(--gold); outline: none; }

#play { top: 30%; }
#prompt {
  font-family: "NH Serif", Georgia, serif;
  font-weight: 400;
  font-style: italic;
  font-size: calc(var(--s) * 0.2);
  line-height: 0.9;
  letter-spacing: -0.02em;
}
/* A whole sentence is set smaller than a one-word prompt. */
#prompt.long {
  font-size: max(1.5rem, calc(var(--s) * 0.105));
  line-height: 1.02;
}
#sub {
  margin-top: calc(var(--s) * 0.035);
  font-size: max(0.9rem, calc(var(--s) * 0.05));
  line-height: 1.2;
  color: var(--gold);
}
#prompt, #sub { animation: rise 0.5s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(0.25em); } to { opacity: 1; transform: none; } }

/* The end card is printed on the morning sky, so it is set in the night's ink.
   The count runs across the top, above her head. The rest sits where the title did. */
#ui #end { inset: 0; left: 0; width: auto; padding: 0; color: var(--blue); }
#end-count {
  position: absolute;
  top: calc(var(--s) * 0.05 + env(safe-area-inset-top));
  left: calc(var(--s) * 0.07);
  right: calc(var(--s) * 0.05);
  display: flex;
  align-items: baseline;
  gap: 0.22em;
  font-family: "NH Serif", Georgia, serif;
  font-weight: 400;
  font-style: italic;
  font-size: calc(var(--s) * 0.118);
  line-height: 1;
  letter-spacing: -0.01em;
}
#end-count .n {
  font-family: "NH Grotesk", system-ui, sans-serif;
  font-weight: 800;
  font-style: normal;
  font-size: 2.5em;
  line-height: 0.8;
  letter-spacing: -0.05em;
}
#end-more {
  position: absolute;
  top: 30%;
  left: calc(var(--s) * 0.46);
  width: min(max(calc(var(--s) * 0.5), 14.5rem), calc(100vw - var(--s) * 0.46 - 0.6rem));
}
#end-hum, #end-why {
  font-size: max(0.8rem, calc(var(--s) * 0.043));
  line-height: 1.22;
}
#end-why { margin-top: calc(var(--s) * 0.012); }
#again { margin-top: calc(var(--s) * 0.05); }
#again:hover, #again:focus-visible { background: var(--blue); color: var(--paper); outline: none; }
#end-credit {
  margin-top: calc(var(--s) * 0.04);
  font-size: max(0.62rem, calc(var(--s) * 0.026));
  line-height: 1.3;
  opacity: 0.7;
}
#end-count, #end-more > * { animation: rise 0.7s ease-out both; }
#end-more > :nth-child(1) { animation-delay: 0.3s; }
#end-more > :nth-child(2) { animation-delay: 0.45s; }
#end-more > :nth-child(3) { animation-delay: 0.75s; }
#end-more > :nth-child(4) { animation-delay: 0.95s; }

@media (prefers-reduced-motion: reduce) {
  #prompt, #sub, #end-count, #end-more > * { animation: none; }
}
</style>
</head>

    <p class="line">Giraffes hum at night.<br>Nobody knows why.</p>

</main>

// Hearing a hum: pitch detection (the McLeod pitch method) and a tracker that
// decides, frame by frame, whether somebody is humming. No browser dependencies.
const Pitch = (() => {
  // Average each run of `factor` samples into one. Plenty for a hum, which
  // has almost nothing above a few hundred hertz.
  const decimate = (samples, factor) => {
    const n = Math.floor(samples.length / factor);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let sum = 0;
      const base = i * factor;
      for (let k = 0; k < factor; k++) sum += samples[base + k];
      out[i] = sum / factor;
    }
    return out;
  };

  let nsdf = new Float32Array(0);

  // The pitch of one window of sound, searched between fMin and fMax.
  // clarity runs 0 to 1: how periodic the window is. freq is 0 if no pitch.
  const detect = (x, sampleRate, fMin, fMax) => {
    const n = x.length;
    let energy = 0;
    for (let i = 0; i < n; i++) energy += x[i] * x[i];
    const rms = Math.sqrt(energy / n);
    if (!(rms > 0)) return { freq: 0, clarity: 0, rms: 0 };

    const tauLo = Math.floor(sampleRate / fMax);
    const tauHi = Math.ceil(sampleRate / fMin);
    const tauMax = Math.min(n - 2, tauHi + 2);
    if (nsdf.length < tauMax + 1) nsdf = new Float32Array(tauMax + 1);

    // Normalised square difference: 1 where the window repeats itself exactly.
    for (let tau = 0; tau <= tauMax; tau++) {
      let acf = 0;
      let norm = 0;
      for (let j = 0, end = n - tau; j < end; j++) {
        const a = x[j];
        const b = x[j + tau];
        acf += a * b;
        norm += a * a + b * b;
      }
      nsdf[tau] = norm > 0 ? (2 * acf) / norm : 0;
    }

    // Key maxima: the highest local peak of each positive stretch, after the
    // stretch around zero lag. Only peaks inside the search range count.
    const peaks = [];
    let best = 0;
    let tau = 1;
    while (tau < tauMax && nsdf[tau] > 0) tau++;
    while (tau < tauMax) {
      while (tau < tauMax && nsdf[tau] <= 0) tau++;
      let peakTau = -1;
      let peakVal = 0;
      while (tau < tauMax && nsdf[tau] > 0) {
        const v = nsdf[tau];
        if (v > peakVal && v >= nsdf[tau - 1] && v >= nsdf[tau + 1]) {
          peakVal = v;
          peakTau = tau;
        }
        tau++;
      }
      if (peakTau >= tauLo && peakTau <= tauHi) {
        peaks.push(peakTau);
        if (peakVal > best) best = peakVal;
      }
    }
    if (!peaks.length) return { freq: 0, clarity: 0, rms };

    // The first peak nearly as high as the best one is the fundamental; later
    // ones are its multiples.
    let pick = peaks[0];
    for (const p of peaks) {
      if (nsdf[p] >= 0.9 * best) {
        pick = p;
        break;
      }
    }

    // A parabola through the peak and its neighbours gives the lag between samples.
    const y0 = nsdf[pick - 1];
    const y1 = nsdf[pick];
    const y2 = nsdf[pick + 1];
    const curve = y0 - 2 * y1 + y2;
    const shift = curve < 0 ? (0.5 * (y0 - y2)) / curve : 0;
    const clarity = Math.min(1, y1 - 0.25 * (y0 - y2) * shift);
    return { freq: sampleRate / (pick + shift), clarity, rms };
  };

  // Turns a stream of mic frames into "is somebody humming, and at what pitch".
  const createTracker = (opts = {}) => {
    const o = { clarityMin: 0.88, onFrames: 3, offFrames: 8, medianLen: 5, calibFrames: 30, calibCap: 0.004, gateFloor: 0.002, ...opts };
    let fMin = 65;
    let fMax = 520;
    let ref = 0;
    let floor = 0;
    let frames = 0;
    let good = 0;
    let bad = 0;
    let voiced = false;
    const recent = [];
    // A frame counts as a hum only above this loudness.
    const gateNow = () => Math.max(4 * floor, 0.12 * ref, o.gateFloor);

    return {
      setRange(lo, hi) {
        fMin = lo;
        fMax = hi;
      },

      // The loudness of the player's own hum. Anything under 12% of it is ignored.
      setReferenceLevel(rms) {
        ref = rms;
      },

      get noiseFloor() {
        return floor;
      },

      get gate() {
        return gateNow();
      },

      push(samples, sampleRate) {
        frames += 1;
        const factor = Math.max(1, Math.round(sampleRate / 12000));
        const r = detect(factor > 1 ? decimate(samples, factor) : samples, sampleRate / factor, fMin, fMax);

        // The first frames only measure the room. What they can learn is
        // capped: a quiet steady tone is the room (mains hum), but anything
        // louder is the player already humming, and must not raise the gate
        // above their own voice.
        if (frames <= o.calibFrames) {
          floor += (Math.min(r.rms, o.calibCap) - floor) / frames;
          return { voiced: false, freq: 0, level: r.rms, clarity: r.clarity };
        }

        // Only noise-like frames move the floor, so an unsteady hum cannot
        // raise its own gate. It drops fast and rises slowly.
        if (r.clarity < 0.5) floor += (r.rms - floor) * (r.rms < floor ? 0.3 : 0.02);

        if (r.freq > 0 && r.clarity >= o.clarityMin && r.rms >= gateNow()) {
          good += 1;
          bad = 0;
          recent.push(r.freq);
          if (recent.length > o.medianLen) recent.shift();
        } else {
          bad += 1;
          good = 0;
          if (!voiced) recent.length = 0;
        }

        if (!voiced && good >= o.onFrames) {
          voiced = true;
        } else if (voiced && bad >= o.offFrames) {
          voiced = false;
          recent.length = 0;
        }
        return { voiced, freq: voiced ? Util.median(recent) : 0, level: r.rms, clarity: r.clarity };
      },
    };
  };

  return { decimate, detect, createTracker };
})();

// Note maths. Everything is measured in semitones from the player's home note,
// the comfortable hum they start with. No browser dependencies.
const Notes = (() => {
  // The neck shows 7 semitones below home (shoulder) to 12 above (throat).
  const AXIS_LO = -7;
  const AXIS_HI = 12;

  // Hum A in the recordings sits on F#2.
  const GIRAFFE_HZ = 92.5;

  // Calf notes in the order they first appear: a major pentatonic around home.
  const ORDER = [0, 4, -3, 7, 2, 9, -5];

  // Just ratios per pitch class, so the herd's bowls are in tune with the player.
  const RATIO = { 0: 1, 2: 9 / 8, 4: 5 / 4, 7: 3 / 2, 9: 5 / 3 };

  const EPS = 1e-9;

  const st = (freq, home) => 12 * Math.log2(freq / home);

  const freq = (s, home) => home * 2 ** (s / 12);

  // Shift by octaves into [lo, hi).
  const wrap = (s, lo, hi) => {
    while (s >= hi - EPS) s -= 12;
    while (s < lo - EPS) s += 12;
    return Math.max(lo, s);
  };

  // Where a pitch shows on the neck. Octaves count, so a pitch outside the
  // neck is moved in by octaves; one already inside stays where it is.
  const fold = (f, home) => wrap(st(f, home), AXIS_LO, AXIS_HI);

  // The same note, in whichever octave on the neck is nearest to `near`.
  // A phone mic can lose the low part of a hum, and the pitch then reads an
  // octave up for a moment. The light should stay where it was.
  const nearOctave = (s, near) => {
    let best = s;
    let bestDist = Math.abs(s - near);
    for (const c of [s - 12, s + 12]) {
      if (c < AXIS_LO - EPS || c >= AXIS_HI - EPS) continue;
      const d = Math.abs(c - near);
      if (d < bestDist) {
        bestDist = d;
        best = c;
      }
    }
    return best;
  };

  const axisT = (s) => (s - AXIS_LO) / (AXIS_HI - AXIS_LO);

  const pc = (offset) => ((offset % 12) + 12) % 12;

  // Is a pitch within halfWidth semitones of a note, in any octave?
  const onBand = (s, offset, halfWidth) => {
    let d = pc(s - offset);
    if (d > 6) d = 12 - d;
    return d <= halfWidth + EPS;
  };

  // Every place on the neck where a note can be hummed.
  const rings = (offset) => {
    const out = [];
    for (let r = wrap(offset, AXIS_LO, AXIS_LO + 12); r < AXIS_HI - EPS; r += 12) out.push(r);
    return out;
  };

  const nearestRing = (s, offset) => {
    let best = offset;
    let bestDist = Infinity;
    for (const r of rings(offset)) {
      const d = Math.abs(r - s);
      if (d < bestDist) {
        bestDist = d;
        best = r;
      }
    }
    return best;
  };

  // The giraffe's own note, in the octave nearest the player's home.
  const giraffeOffset = (home) => wrap(st(GIRAFFE_HZ, home), -5, 7);

  const ratio = (offset) => {
    const p = pc(offset);
    return RATIO[p] !== undefined ? RATIO[p] : 2 ** (p / 12);
  };

  // Bowls ring two octaves above the hum (plus `octave`), clear of the band
  // the mic listens in.
  const bowlHz = (offset, home, octave = 0) => ratio(offset) * home * 4 * 2 ** octave;

  // Finds the home note: the first 1.2 s of unbroken hum that holds still.
  const createHomeCapture = () => {
    const HOLD = 1.2;
    const SPREAD = 2;
    let clock = 0;
    let since = null;   // when the current unbroken hum began
    let run = [];       // its last HOLD seconds

    return {
      push(dt, voiced, f, level) {
        clock += dt;
        if (!voiced || !(f > 0)) {
          run = [];
          since = null;
          return null;
        }
        if (since === null) since = clock;
        run.push({ t: clock, f, level });
        // The length of the hum is measured from its start, not from whichever
        // sample happens to be oldest. Frames arrive at any spacing, and
        // waiting for one to land exactly HOLD seconds back would never end.
        while (clock - run[0].t > HOLD + 1e-9) run.shift();
        if (clock - since < HOLD - 1e-9) return null;

        let lo = Infinity;
        let hi = -Infinity;
        let sum = 0;
        for (const s of run) {
          const semis = 12 * Math.log2(s.f);
          if (semis < lo) lo = semis;
          if (semis > hi) hi = semis;
          sum += s.level;
        }
        if (hi - lo > SPREAD) return null;
        return { home: Util.median(run.map((s) => s.f)), level: sum / run.length };
      },
    };
  };

  return {
    AXIS_LO, AXIS_HI, GIRAFFE_HZ, ORDER,
    st, freq, fold, nearOctave, axisT, pc, onBand, rings, nearestRing, giraffeOffset, ratio, bowlHz, createHomeCapture,
  };
})();

// One night of Night Hum as a state machine. It is fed "is the player humming,
// and at what pitch" every frame and knows nothing about sound or drawing.
// No browser dependencies.
const Game = (() => {
  const K = {
    NIGHT: 75,          // seconds of night before dawn
    DAWN_MAX: 15,       // the sunrise starts by itself after this long
    SUNRISE: 8,
    HOLD: 2,            // seconds on the giraffe's note that start the sunrise
    GRACE: 0.25,        // a calf keeps walking this long after the light leaves its band
    FIRST_DELAY: 0.8,
    SPAWN_DELAY: 1.2,
    DIST: [2.5, 4, 5.5], // seconds on the note, at speed 1, to walk home
    ANSWER_MIN: 1.5,    // a hum this long gets an answer from the herd
    HINT_AFTER: 2.5,
    HINT_SHOW: 1.5,
    HINT_GAP: 6,
    STRAY: 5,           // seconds for a calf left at sunrise to trot home
    MAX_DT: 0.1,
    TOUCH_HOME: 138.6,
  };

  const create = ({ seed = 1, fixedHome = null } = {}) => {
    const rand = Util.rng(seed);
    const capture = Notes.createHomeCapture();
    let events = [];
    let spawnTimer = K.FIRST_DELAY;
    let nextIndex = 0;
    let lastPc = -1;
    let runLen = 0;       // length of the current unbroken hum
    let runStart = 0;     // its first pitch, the stand-in for home while listening
    let offBand = 0;      // voiced time spent off every band
    let hintLeft = 0;
    let sinceHint = Infinity;

    const g = {
      state: 'listen',
      home: null,
      homeLevel: 0,
      giraffe: null,      // the giraffe's note as an offset from home
      energy: 0,
      score: 0,
      held: 0,
      prompt: 'Hum.',
      hint: null,
      light: { on: false, st: 0 },
      clock: { listen: 0, night: 0, dawn: 0, sunrise: 0 },
      calves: [],
      herd: [],           // calves at home, in the order they arrived
    };

    const emit = (e) => events.push(e);
    const waiting = () => g.calves.filter((c) => c.state === 'waiting');

    const halfWidth = (calf) => (calf.index < 2 ? 1.5 : g.score >= 6 ? 1.0 : 1.2);

    const setHome = (home, level) => {
      g.home = home;
      g.homeLevel = level;
      g.giraffe = Notes.giraffeOffset(home);
      g.state = 'night';
      g.prompt = null;
      spawnTimer = K.FIRST_DELAY;
      emit({ type: 'homeSet', home, level });
    };

    const spawn = () => {
      const index = nextIndex++;
      let offset;
      if (index < Notes.ORDER.length) {
        offset = Notes.ORDER[index];
      } else {
        do {
          offset = Notes.ORDER[Math.floor(rand() * Notes.ORDER.length)];
        } while (Notes.pc(offset) === lastPc);
      }
      lastPc = Notes.pc(offset);
      const dist = index === 0 ? K.DIST[0] : index === 1 ? K.DIST[1] : K.DIST[Math.floor(rand() * K.DIST.length)];
      const taken = waiting().map((c) => c.lane);
      const lane = [0, 1, 2].find((l) => !taken.includes(l));
      const calf = { id: index + 1, index, offset, dist, lane, progress: 0, state: 'waiting', bowlOctave: 0, active: false, grace: 0, homeIndex: -1 };
      g.calves.push(calf);
      emit({ type: 'spawn', id: calf.id });
    };

    const arrive = (calf) => {
      calf.state = 'home';
      calf.progress = 1;
      calf.active = false;
      // The second calf home on a note rings an octave higher: no doubles.
      calf.bowlOctave = g.herd.filter((c) => Notes.pc(c.offset) === Notes.pc(calf.offset)).length % 2;
      calf.homeIndex = g.herd.length;
      g.herd.push(calf);
      g.score += 1;
      emit({ type: 'home', id: calf.id, offset: calf.offset, bowlOctave: calf.bowlOctave });
    };

    const startSunrise = (held) => {
      g.state = 'sunrise';
      g.prompt = null;
      g.hint = null;
      for (const c of waiting()) {
        c.state = 'stray';
        c.active = false;
      }
      emit({ type: 'sunrise', held });
    };

    g.targets = () => {
      const out = waiting().map((c) => ({ kind: 'calf', id: c.id, offset: c.offset, halfWidth: halfWidth(c), active: c.active }));
      if (g.state === 'dawn') {
        out.push({ kind: 'giraffe', id: 'giraffe', offset: g.giraffe, halfWidth: 1.5, active: g.light.on && Notes.onBand(g.light.st, g.giraffe, 1.5) });
      }
      return out;
    };

    g.drain = () => {
      const out = events;
      events = [];
      return out;
    };

    // Night and dawn: calves appear, walk while the light is in their band,
    // and a one-word hint helps a player who is lost.
    const play = (dt, voiced) => {
      if (g.state === 'night' && g.clock.night >= K.NIGHT) {
        g.state = 'dawn';
        g.prompt = 'Their note.';
        emit({ type: 'dawn' });
      }

      if (g.state === 'night') {
        const limit = g.score < 1 ? 1 : g.score < 4 ? 2 : 3;
        if (waiting().length < limit) {
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawn();
            spawnTimer = K.SPAWN_DELAY;
          }
        } else {
          spawnTimer = K.SPAWN_DELAY;
        }
      }

      const speed = 0.7 + 0.6 * g.energy;
      for (const calf of waiting()) {
        calf.active = g.light.on && Notes.onBand(g.light.st, calf.offset, halfWidth(calf));
        calf.grace = calf.active ? K.GRACE : Math.max(0, calf.grace - dt);
        if (calf.grace > 0) {
          calf.progress += (dt * speed) / calf.dist;
          if (calf.progress >= 1) arrive(calf);
        }
      }

      sinceHint += dt;
      if (hintLeft > 0) {
        hintLeft -= dt;
        if (hintLeft <= 0) g.hint = null;
      }
      const targets = g.targets();
      if (targets.some((t) => t.active)) {
        offBand = 0;
      } else if (voiced && targets.length) {
        offBand += dt;
        if (offBand >= K.HINT_AFTER && sinceHint >= K.HINT_GAP) {
          let nearest = Infinity;
          let up = true;
          for (const t of targets) {
            const ring = Notes.nearestRing(g.light.st, t.offset);
            const d = Math.abs(ring - g.light.st);
            if (d < nearest) {
              nearest = d;
              up = ring > g.light.st;
            }
          }
          g.hint = up ? 'Higher' : 'Lower';
          hintLeft = K.HINT_SHOW;
          sinceHint = 0;
          offBand = 0;
        }
      }

      if (g.state === 'dawn') {
        if (g.light.on && Notes.onBand(g.light.st, g.giraffe, 1.5)) g.held += dt;
        if (g.held >= K.HOLD) startSunrise(true);
        else if (g.clock.dawn >= K.DAWN_MAX) startSunrise(false);
      }
    };

    g.update = (rawDt, input) => {
      const dt = Util.clamp(rawDt, 0, K.MAX_DT);
      const voiced = !!input.voiced && input.freq > 0;
      if (g.state !== 'end') g.clock[g.state] += dt;

      if (voiced) {
        if (runLen === 0) runStart = input.freq;
        const heard = Notes.fold(input.freq, g.home || runStart);
        // Within one hum the light keeps to its octave, so a pitch that reads
        // an octave off for a moment does not throw it across the neck.
        g.light.st = runLen > 0 ? Notes.nearOctave(heard, g.light.st) : heard;
        runLen += dt;
        g.light.on = true;
      } else {
        g.light.on = false;
      }
      g.energy = Util.clamp(g.energy + (voiced ? dt / 5 : -dt / 9), 0, 1);

      if (g.state === 'listen') {
        const got = capture.push(dt, voiced, input.freq, input.level);
        if (got) setHome(got.home, got.level);
      } else if (g.state === 'night' || g.state === 'dawn') {
        play(dt, voiced);
      } else if (g.state === 'sunrise') {
        for (const c of g.calves) {
          if (c.state === 'stray') c.progress = Math.min(1, c.progress + dt / K.STRAY);
        }
        if (g.clock.sunrise >= K.SUNRISE) {
          g.state = 'end';
          emit({ type: 'end' });
        }
      }

      // When a long enough hum ends, the calves at home answer it.
      if (!voiced) {
        if (runLen >= K.ANSWER_MIN && (g.state === 'night' || g.state === 'dawn') && g.herd.length) {
          emit({ type: 'answer', notes: g.herd.map((c) => ({ offset: c.offset, bowlOctave: c.bowlOctave })) });
        }
        runLen = 0;
      }
    };

    if (fixedHome) setHome(fixedHome, 0.1);
    return g;
  };

  return { K, create };
})();

// Sound: the mic chain that hears the hum, the herd's singing bowls, the night
// bed, the real giraffe hum, and a synthesised hum for playing without a mic.
// Nothing the mic hears is recorded, kept, sent anywhere or played back.
const Sound = (() => {
  const SILENT = { voiced: false, freq: 0, level: 0, clarity: 0 };

  // Singing bowl recipe, shared with the giraffe hum reel: five modes, each a
  // slowly beating pair.
  const MODES = [1, 2.74, 5.13, 8.12, 11.7];
  const AMPS = [1, 0.55, 0.26, 0.12, 0.05];
  const TAUS = [7.5, 3.6, 1.9, 1.0, 0.55];
  const SPLIT = [0.8, 1.8, 2.8, 3.8, 4.6];
  const BOWL_GAIN = 0.34;
  const WET = 0.32;       // how much of the room the bowls ring in
  const NIGHT_GAIN = 1;   // the night bed is a quiet recording: about -39 dBFS at this gain

  // The sunrise is in the giraffe's own key: hum A sits on F#2, hum B around A2.
  const GIRAFFE_BOWLS = [185, 222, 277.5, 370];

  let ctx = null;
  let master = null;
  let bus = null;        // bowls, the real hum and the touch hum; feeds the reverb too
  let wet = null;        // the reverb's return
  const voices = new Set(); // every bowl or hum that is still sounding
  let speakers = null;   // last gain before the output, for muting
  let sink = null;       // silent path that keeps analysers running in every browser
  let meter = null;
  let meterBuf = null;

  let tracker = Pitch.createTracker();
  let micStream = null;
  let micSource = null;
  let lowpass = [];
  let detect = null;     // analyser on the filtered hum band, for pitch
  let spectrum = null;   // analyser on the raw mic, for the neck's rungs
  let timeBuf = null;
  let freqBuf = null;
  let giraffeTap = null;
  let giraffeBuf = null;

  const samples = {};    // decoded ASSETS
  const bowls = new Map();
  let bowlJob = 0;
  let nightGain = null;
  let nightTimer = 0;
  let touch = null;

  const api = { fake: null, loaded: null };

  // Web Audio's low-pass and high-pass filters take Q as a resonance in
  // decibels, not as the usual plain number.
  const toDb = (q) => 20 * Math.log10(q);

  const decode = (b64) => new Promise((resolve, reject) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer, resolve, reject);
  });

  // A short, warm room: filtered noise that dies away over about 2.4 s.
  const makeImpulse = (seconds) => {
    const sr = ctx.sampleRate;
    const n = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(2, n, sr);
    const rand = Util.rng(21);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let soft = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        soft += (rand() * 2 - 1 - soft) * 0.35;
        d[i] = soft * Math.exp((-6.91 * t) / 2.4) * Math.min(1, t / 0.03);
      }
    }
    return buf;
  };

  // On an iPhone, sound made without the mic obeys the ring/silent switch
  // unless the page says it is here to play audio ('playback'). With the mic
  // open the phone runs the session itself, so that case is left on 'auto'.
  const session = (type) => {
    try {
      if (navigator.audioSession) navigator.audioSession.type = type;
    } catch (err) {
      // Older Safari has no audio session to set.
    }
  };

  // iPhones pause the audio context when the mic starts, a call comes in or
  // the page is put away. While it is paused the mic reads silence and nothing
  // plays.
  const asleep = () => !!ctx && ctx.state !== 'running';

  // A resume that still needs a tap never settles, so this does not wait on it.
  const wake = () => {
    if (!ctx || ctx.state === 'running') return Promise.resolve();
    return Promise.race([ctx.resume().catch(() => {}), new Promise((done) => setTimeout(done, 400))]);
  };

  // Creates the audio context. Call it from inside a tap or a key press.
  // The promise never waits long: on a phone the first resume can hang, and
  // the game must still start.
  const init = () => {
    if (ctx) return wake();
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });

    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -10;
    limiter.knee.value = 12;
    limiter.ratio.value = 6;
    limiter.attack.value = 0.005;
    limiter.release.value = 0.25;
    master = ctx.createGain();
    master.gain.value = 0.9;
    speakers = ctx.createGain();
    master.connect(limiter);
    limiter.connect(speakers);
    speakers.connect(ctx.destination);

    const reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(2.8);
    wet = ctx.createGain();
    wet.gain.value = WET;
    bus = ctx.createGain();
    bus.connect(master);
    bus.connect(reverb);
    reverb.connect(wet);
    wet.connect(master);

    sink = ctx.createGain();
    sink.gain.value = 0;
    sink.connect(ctx.destination);

    meter = ctx.createAnalyser();
    meter.fftSize = 2048;
    meterBuf = new Float32Array(meter.fftSize);
    master.connect(meter);
    meter.connect(sink);

    api.loaded = Promise.all(Object.keys(ASSETS).map((k) => decode(ASSETS[k]).then((b) => { samples[k] = b; })));
    api.loaded.catch(() => {});
    GIRAFFE_BOWLS.forEach((hz, i) => queueBowl(`hz:${hz}`, hz, 8, 40 + i));
    return wake();
  };

  // Opens the mic. Resolves false when there is none or it is refused.
  // With `fake`, an oscillator stands in for the mic (tests).
  const startMic = async ({ fake = null } = {}) => {
    if (!ctx) return false;
    let source;
    if (fake) {
      const osc = ctx.createOscillator();
      osc.setPeriodicWave(ctx.createPeriodicWave(new Float32Array(4), new Float32Array([0, 1, 0.5, 0.25]), { disableNormalization: true }));
      osc.frequency.value = fake;
      const gain = ctx.createGain();
      gain.gain.value = 0.2;
      osc.connect(gain);
      osc.start();
      api.fake = { osc, gain };
      source = gain;
    } else {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      try {
        // Noise suppression treats a steady hum as noise and removes it, so all three are off.
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
          video: false,
        });
      } catch (err) {
        return false;
      }
      // Starting the mic is exactly when an iPhone pauses the context.
      await wake();
      source = ctx.createMediaStreamSource(micStream);
    }
    micSource = source;

    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 55;
    highpass.Q.value = toDb(0.7071);
    // Four biquads with these Qs make one 8th-order Butterworth low-pass: flat
    // through the hum band, then a steep wall that keeps the bowls out.
    lowpass = [0.5098, 0.6013, 0.9, 2.5629].map((q) => {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 700;
      f.Q.value = toDb(q);
      return f;
    });
    detect = ctx.createAnalyser();
    detect.fftSize = 4096;
    detect.smoothingTimeConstant = 0;
    let node = highpass;
    source.connect(highpass);
    for (const f of lowpass) {
      node.connect(f);
      node = f;
    }
    node.connect(detect);
    detect.connect(sink);

    spectrum = ctx.createAnalyser();
    spectrum.fftSize = 4096;
    spectrum.smoothingTimeConstant = 0.5;
    source.connect(spectrum);
    spectrum.connect(sink);

    timeBuf = new Float32Array(detect.fftSize);
    freqBuf = new Float32Array(spectrum.frequencyBinCount);
    tracker = Pitch.createTracker();
    return true;
  };

  const stopMic = () => {
    if (micStream) micStream.getTracks().forEach((t) => t.stop());
    if (api.fake) {
      api.fake.osc.stop();
      api.fake = null;
    }
    if (micSource) micSource.disconnect();
    micStream = null;
    micSource = null;
    detect = null;
    spectrum = null;
    lowpass = [];
  };

  // One frame of listening: is somebody humming, and at what pitch?
  const read = () => {
    if (!detect) return SILENT;
    detect.getFloatTimeDomainData(timeBuf);
    return tracker.push(timeBuf, ctx.sampleRate);
  };

  // Eight levels, 0 to 1, for the rungs of light above the surface.
  //   'mic':     harmonics 2 to 9 of the player's hum
  //   'giraffe': the real hum's spectrum, 70 to 760 Hz, in eight log-spaced bands
  //   'touch':   a fixed hum-like roll-off
  const harmonics = (f0, out, source = 'mic') => {
    out.fill(0);
    if (source === 'touch') {
      for (let i = 0; i < out.length; i++) out[i] = 0.75 * 0.72 ** i;
      return;
    }
    const an = source === 'giraffe' ? giraffeTap : spectrum;
    const buf = source === 'giraffe' ? giraffeBuf : freqBuf;
    if (!an) return;
    an.getFloatFrequencyData(buf);
    const binHz = ctx.sampleRate / an.fftSize;
    const db = new Array(out.length).fill(-Infinity);
    let top = -Infinity;
    const peak = (lo, hi) => {
      let v = -Infinity;
      for (let b = Math.max(1, lo); b <= Math.min(buf.length - 1, hi); b++) if (buf[b] > v) v = buf[b];
      return v;
    };
    if (source === 'giraffe') {
      for (let i = 0; i < out.length; i++) {
        const lo = 70 * (760 / 70) ** (i / out.length);
        const hi = 70 * (760 / 70) ** ((i + 1) / out.length);
        db[i] = peak(Math.round(lo / binHz), Math.round(hi / binHz));
        if (db[i] > top) top = db[i];
      }
    } else {
      if (!(f0 > 0)) return;
      const c1 = Math.round(f0 / binHz);
      top = peak(c1 - 1, c1 + 1);
      for (let i = 0; i < out.length; i++) {
        const c = Math.round(((i + 2) * f0) / binHz);
        db[i] = peak(c - 1, c + 1);
        if (db[i] > top) top = db[i];
      }
    }
    if (top < -95) return;
    for (let i = 0; i < out.length; i++) out[i] = Util.clamp((db[i] - top + 36) / 36, 0, 1);
  };

  // One decaying partial, added into d with a recursive oscillator (no
  // per-sample trig), so a bowl renders in a few milliseconds.
  const addPartial = (d, sr, f, phase, amp, tau) => {
    const w = (2 * Math.PI * f) / sr;
    const c = 2 * Math.cos(w);
    let y1 = Math.cos(phase - w);
    let y2 = Math.cos(phase - 2 * w);
    let env = amp;
    const k = Math.exp(-1 / (tau * sr));
    const attack = Math.floor(0.003 * sr);
    for (let i = 0; i < d.length; i++) {
      const y = c * y1 - y2;
      y2 = y1;
      y1 = y;
      d[i] += y * env * (i < attack ? i / attack : 1);
      env *= k;
    }
  };

  const renderBowl = (f0, seconds, seed) => {
    const sr = ctx.sampleRate;
    const n = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const rand = Util.rng(seed);
    // Small, high bowls ring for less time than big, low ones.
    const ring = 0.75 * Util.clamp(Math.sqrt(185 / f0), 0.35, 1);
    for (let k = 0; k < MODES.length; k++) {
      const f = f0 * MODES[k] * (k ? 1 + (rand() - 0.5) * 0.008 : 1);
      if (f > sr * 0.45) continue;
      const beta = k === 0 ? 0.2 : 0.35;
      const a = AMPS[k] / (1 + beta);
      addPartial(d, sr, f - SPLIT[k] / 2, rand() * 2 * Math.PI, a, TAUS[k] * ring);
      addPartial(d, sr, f + SPLIT[k] / 2, rand() * 2 * Math.PI, a * beta, TAUS[k] * ring);
    }
    // Felt mallet: a short, soft knock.
    let lo = 0;
    let hi = 0;
    const knock = Math.floor(0.06 * sr);
    for (let i = 0; i < knock; i++) {
      const white = rand() * 2 - 1;
      hi += (white - hi) * 0.25;
      lo += (white - lo) * 0.05;
      d[i] += (hi - lo) * 0.12 * Math.exp(-i / (0.007 * sr));
    }
    let peak = 0;
    for (let i = 0; i < n; i++) if (Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
    const fade = Math.floor(0.8 * sr);
    for (let i = 0; i < n; i++) d[i] *= (0.9 / peak) * Math.min(1, (n - i) / fade);
    return buf;
  };

  // Bowls render one per timer tick, so no frame stalls.
  const queueBowl = (key, hz, seconds, seed) => {
    const job = bowlJob;
    setTimeout(() => {
      if (job !== bowlJob && !key.startsWith('hz:')) return;
      bowls.set(key, renderBowl(hz, seconds, seed));
    }, 0);
  };

  // The player's home note is known: tighten the filters around their voice
  // and tune the herd's bowls to it.
  const setHome = (home, level) => {
    if (!ctx) return;
    tracker.setRange(home * 2 ** (-9 / 12), home * 2 ** (14 / 12));
    tracker.setReferenceLevel(level);
    for (const f of lowpass) f.frequency.setTargetAtTime(2.3 * home, ctx.currentTime, 0.05);
    bowlJob += 1;
    for (const key of [...bowls.keys()]) if (!key.startsWith('hz:')) bowls.delete(key);
    let seed = 1;
    for (const octave of [0, 1]) {
      for (const p of [0, 2, 4, 7, 9]) queueBowl(`${p}:${octave}`, Notes.bowlHz(p, home, octave), 6, seed++);
    }
  };

  // A new player may hum anywhere: widen the filters and the search again.
  const clearHome = () => {
    if (!ctx) return;
    tracker.setRange(65, 520);
    tracker.setReferenceLevel(0);
    for (const f of lowpass) f.frequency.setTargetAtTime(700, ctx.currentTime, 0.05);
  };

  // note is { offset, bowlOctave } for a calf, or a frequency in Hz for the
  // giraffe-key bowls of the sunrise.
  const strike = (note, velocity = 0.8, delay = 0) => {
    if (!ctx) return;
    const key = typeof note === 'number' ? `hz:${note}` : `${Notes.pc(note.offset)}:${note.bowlOctave}`;
    const buf = bowls.get(key);
    if (!buf) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = velocity * BOWL_GAIN;
    src.connect(g);
    g.connect(bus);
    src.start(ctx.currentTime + delay);
    keep(src);
  };

  const keep = (src) => {
    voices.add(src);
    src.onended = () => voices.delete(src);
  };

  // Stops everything that is still ringing, so a new night starts from
  // silence. Without this the mic can take the last chord for the first hum.
  const hush = () => {
    if (!ctx) return;
    const t = ctx.currentTime;
    for (const node of [bus, wet]) {
      node.gain.cancelScheduledValues(t);
      node.gain.setTargetAtTime(0, t, 0.04);
    }
    const ringing = [...voices];
    voices.clear();
    setTimeout(() => {
      for (const src of ringing) {
        try {
          src.stop();
        } catch (err) {
          // It had already ended.
        }
      }
      const now = ctx.currentTime;
      bus.gain.setTargetAtTime(1, now, 0.02);
      // The room's own tail needs a couple of seconds to die before it comes back.
      wet.gain.setTargetAtTime(WET, now + 2.6, 0.2);
    }, 250);
  };

  // The herd answers a hum: one bowl each, rippling in the order they came home.
  const answer = (notes) => {
    const velocity = 0.45 / Math.sqrt(Math.max(1, notes.length / 3));
    notes.forEach((n, i) => strike(n, velocity, i * 0.12));
  };

  const startNight = () => {
    if (!ctx || nightGain) return;
    nightGain = ctx.createGain();
    nightGain.gain.value = 0;
    nightGain.connect(master);
    nightGain.gain.setTargetAtTime(NIGHT_GAIN, ctx.currentTime, 1.5);
    const gainNode = nightGain;
    api.loaded.then(() => {
      const buf = samples.night;
      const FADE = 2;
      const span = buf.duration - 0.2; // trims the MP3's padding
      const play = (when) => {
        if (nightGain !== gainNode) return;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(1, when + FADE);
        g.gain.setValueAtTime(1, when + span - FADE);
        g.gain.linearRampToValueAtTime(0, when + span);
        src.connect(g);
        g.connect(gainNode);
        src.start(when, 0.1, span);
        const next = when + span - FADE;
        nightTimer = setTimeout(() => play(next), Math.max(0, (next - ctx.currentTime - 1) * 1000));
      };
      play(ctx.currentTime + 0.05);
    }).catch(() => {});
  };

  const stopNight = () => {
    if (!nightGain) return;
    clearTimeout(nightTimer);
    const g = nightGain;
    nightGain = null;
    g.gain.setTargetAtTime(0, ctx.currentTime, 1.2);
    setTimeout(() => g.disconnect(), 7000);
  };

  // The sunrise: a real recorded giraffe hums, with bowls in its own key so
  // phone speakers, which cannot reproduce 92 Hz, still carry it.
  const playGiraffe = () => {
    if (!ctx) return;
    if (!giraffeTap) {
      giraffeTap = ctx.createAnalyser();
      giraffeTap.fftSize = 4096;
      giraffeTap.smoothingTimeConstant = 0.6;
      giraffeTap.connect(sink);
      giraffeBuf = new Float32Array(giraffeTap.frequencyBinCount);
    }
    const out = ctx.createGain();
    out.gain.value = 0.8;
    out.connect(bus);
    out.connect(giraffeTap);
    const t0 = ctx.currentTime + 0.05;
    const play = (buf, when) => {
      if (!buf) return;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(out);
      src.start(when);
      keep(src);
    };
    play(samples.humA, t0);
    play(samples.humB, t0 + 2.9);
    strike(185, 0.7, 0.05);
    strike(222, 0.6, 2.9);
    strike(185, 0.5, 7.4);
    strike(277.5, 0.4, 7.5);
    strike(370, 0.35, 7.6);
  };

  // A soft two-partial hum for playing without a mic.
  const touchHum = (on, freq) => {
    if (!ctx) return;
    if (!touch) {
      if (!on) return;
      const o1 = ctx.createOscillator();
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      const g = ctx.createGain();
      const lp = ctx.createBiquadFilter();
      g2.gain.value = 0.28;
      g.gain.value = 0;
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      o1.frequency.value = freq;
      o2.frequency.value = freq * 2;
      o1.connect(g);
      o2.connect(g2);
      g2.connect(g);
      g.connect(lp);
      lp.connect(bus);
      o1.start();
      o2.start();
      touch = { o1, o2, g };
    }
    const t = ctx.currentTime;
    if (on && freq > 0) {
      touch.o1.frequency.setTargetAtTime(freq, t, 0.03);
      touch.o2.frequency.setTargetAtTime(freq * 2, t, 0.03);
    }
    touch.g.gain.setTargetAtTime(on ? 0.2 : 0, t, 0.027);
  };

  // What the phone is actually doing, for the ?debug readout.
  const debug = () => {
    const track = micStream && micStream.getAudioTracks()[0];
    const got = track && track.getSettings ? track.getSettings() : {};
    return {
      context: ctx ? ctx.state : 'none',
      rate: ctx ? ctx.sampleRate : 0,
      session: navigator.audioSession ? navigator.audioSession.type : 'n/a',
      mic: !detect ? 'off' : api.fake ? 'stand-in' : track ? track.readyState + (track.muted ? ' muted' : '') : 'on',
      echo: got.echoCancellation,
      noise: got.noiseSuppression,
      agc: got.autoGainControl,
      micRate: got.sampleRate,
      floor: tracker.noiseFloor,
      gate: tracker.gate,
    };
  };

  const mute = (on) => {
    if (speakers) speakers.gain.value = on ? 0 : 1;
  };

  // Pauses the context the way a phone does (tests).
  const sleep = () => (ctx ? ctx.suspend() : Promise.resolve());

  // RMS of what is going to the speakers (tests).
  const outputLevel = () => {
    if (!meter) return 0;
    meter.getFloatTimeDomainData(meterBuf);
    let sum = 0;
    for (let i = 0; i < meterBuf.length; i++) sum += meterBuf[i] * meterBuf[i];
    return Math.sqrt(sum / meterBuf.length);
  };

  return Object.assign(api, {
    init, startMic, stopMic, read, harmonics, setHome, clearHome, strike, answer, hush, startNight, stopNight, playGiraffe, touchHum,
    session, asleep, wake, sleep, resume: wake, mute, outputLevel, debug,
    isReady: () => !!ctx,
    hasMic: () => !!detect,
    bowlCount: () => bowls.size,
  });
})();

// The world of Night Hum, built once per window size: where everything stands,
// the giraffe's shape and coat, and the two printed layers. One layer is the
// lit world in gold on paper. The other is the night, a flood of blue over it.
// Everything is in CSS pixels, laid out on a portrait unit `s`.
const Art = (() => {
  const INK = { paper: '#F2E8D5', blue: '#1D2B6B', deep: '#141C4A', gold: '#F2A922', rose: '#EE5E7B' };
  const TAU = Math.PI * 2;

  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  };

  // Shapes that overlap must wind the same way, or the overlap cancels out
  // and leaves a hole when they are filled or clipped together.
  const wound = (pts) => {
    let area = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % pts.length];
      area += a[0] * b[1] - b[0] * a[1];
    }
    return area < 0 ? pts.slice().reverse() : pts;
  };

  const poly = (path, points) => {
    const pts = wound(points);
    path.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]);
    path.closePath();
  };

  // A closed, rounded shape: the points are corners that get cut smooth.
  const blob = (path, points) => {
    const pts = wound(points);
    const n = pts.length;
    const mx = (a, b) => (a[0] + b[0]) / 2;
    const my = (a, b) => (a[1] + b[1]) / 2;
    path.moveTo(mx(pts[n - 1], pts[0]), my(pts[n - 1], pts[0]));
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const q = pts[(i + 1) % n];
      path.quadraticCurveTo(p[0], p[1], mx(p, q), my(p, q));
    }
    path.closePath();
  };

  // Keep the part of a convex polygon on the near side of a line through
  // (mx, my) with normal (nx, ny).
  const clipHalf = (pts, mx, my, nx, ny) => {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % pts.length];
      const da = (a[0] - mx) * nx + (a[1] - my) * ny;
      const db = (b[0] - mx) * nx + (b[1] - my) * ny;
      if (da <= 0) out.push(a);
      if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
        const t = da / (da - db);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    return out;
  };

  // A giraffe's coat: patches with pale lines between them. The patches are
  // the cells of a Voronoi diagram, each pulled back from its neighbours by
  // half a line's width, and they get smaller toward the head.
  const makePatches = (s, h, rand) => {
    const spacing = (y) => Util.lerp(0.037, 0.066, Util.clamp((y - 0.2 * h) / (0.7 * h), 0, 1)) * s;
    const pts = [];
    for (let tries = 0; tries < 9000; tries++) {
      const x = Util.lerp(-0.07 * s, 0.68 * s, rand());
      const y = Util.lerp(0.04 * h, 1.05 * h, rand());
      const d = spacing(y);
      let ok = true;
      for (let i = 0; i < pts.length; i++) {
        const dx = pts[i][0] - x;
        const dy = pts[i][1] - y;
        if (dx * dx + dy * dy < d * d) {
          ok = false;
          break;
        }
      }
      if (ok) pts.push([x, y, d]);
    }
    const path = new Path2D();
    for (let i = 0; i < pts.length; i++) {
      const [x, y, d] = pts[i];
      const line = d * 0.25;
      const reach = d * 2.6;
      let cell = [[x - reach, y - reach], [x + reach, y - reach], [x + reach, y + reach], [x - reach, y + reach]];
      for (let j = 0; j < pts.length && cell.length >= 3; j++) {
        if (j === i) continue;
        const dx = pts[j][0] - x;
        const dy = pts[j][1] - y;
        const dist = Math.hypot(dx, dy);
        if (dist > reach * 2.9) continue;
        const nx = dx / dist;
        const ny = dy / dist;
        const back = dist / 2 - line / 2;
        cell = clipHalf(cell, x + nx * back, y + ny * back, nx, ny);
      }
      if (cell.length >= 3) blob(path, cell);
    }
    return path;
  };

  // The mother: neck, head, ears, ossicones and a body cropped by the screen.
  const makeGiraffe = (s, h, rand) => {
    const base = { x: 0.2 * s, y: 0.79 * h };
    const throat = { x: 0.345 * s, y: 0.235 * h };
    const ctrl = { x: (base.x + throat.x) / 2 - 0.035 * s, y: (base.y + throat.y) / 2 };
    const baseWidth = 0.2 * s;
    const throatWidth = 0.088 * s;

    // A point on the neck's centre line: t = 0 at the shoulder, 1 at the throat.
    // (nx, ny) points to her right-hand side on screen.
    const neckAt = (t) => {
      const u = 1 - t;
      const x = u * u * base.x + 2 * t * u * ctrl.x + t * t * throat.x;
      const y = u * u * base.y + 2 * t * u * ctrl.y + t * t * throat.y;
      let dx = 2 * u * (ctrl.x - base.x) + 2 * t * (throat.x - ctrl.x);
      let dy = 2 * u * (ctrl.y - base.y) + 2 * t * (throat.y - ctrl.y);
      const len = Math.hypot(dx, dy);
      dx /= len;
      dy /= len;
      return { x, y, nx: -dy, ny: dx, width: Util.lerp(baseWidth, throatWidth, Math.pow(Util.clamp(t, 0, 1), 0.8)) };
    };

    const silhouette = new Path2D();

    const left = [];
    const right = [];
    for (let i = 0; i <= 26; i++) {
      const p = neckAt(-0.05 + (1.05 * i) / 26);
      left.push([p.x - (p.nx * p.width) / 2, p.y - (p.ny * p.width) / 2]);
      right.push([p.x + (p.nx * p.width) / 2, p.y + (p.ny * p.width) / 2]);
    }
    poly(silhouette, left.concat(right.reverse()));

    const at = (pts) => pts.map(([x, y]) => [throat.x + x * s, throat.y + y * s]);
    blob(silhouette, at([
      [-0.046, 0.012], [-0.054, -0.04], [-0.03, -0.08], [0.02, -0.09], [0.078, -0.08], [0.16, -0.042],
      [0.236, -0.01], [0.266, 0.012], [0.26, 0.037], [0.226, 0.052], [0.14, 0.054], [0.072, 0.06], [0.046, 0.022],
    ]));
    // Ossicones and ear: too small for patches, so they are printed solid.
    const solid = new Path2D();
    for (const part of [
      [[-0.008, -0.07], [-0.022, -0.128], [-0.006, -0.15], [0.012, -0.132], [0.022, -0.074]],
      [[0.034, -0.074], [0.032, -0.124], [0.047, -0.143], [0.062, -0.124], [0.064, -0.074]],
      [[-0.026, -0.066], [-0.084, -0.122], [-0.126, -0.108], [-0.08, -0.062], [-0.04, -0.046]],
    ]) {
      blob(silhouette, at(part));
      blob(solid, at(part));
    }

    blob(silhouette, [
      [0.085 * s, 0.772 * h], [-0.04 * s, 0.812 * h], [-0.04 * s, 0.952 * h], [0.09 * s, 0.957 * h], [0.205 * s, 0.962 * h],
      [0.212 * s, 1.03 * h], [0.302 * s, 1.03 * h], [0.296 * s, 0.955 * h], [0.336 * s, 0.905 * h], [0.352 * s, 0.86 * h],
      [0.318 * s, 0.795 * h],
    ]);

    return {
      neck: { base, throat, baseWidth, throatWidth },
      neckAt,
      silhouette,
      solid,
      patches: makePatches(s, h, rand),
      eye: { x: throat.x + 0.104 * s, y: throat.y - 0.022 * s, r: 0.0062 * s },
      chestY: base.y - 0.02 * h,
    };
  };

  // A calf, drawn one unit tall with its feet at the origin, facing left.
  // phase runs the walk cycle; stride is 0 when it stands.
  const calfPath = (phase, stride) => {
    const path = new Path2D();
    blob(path, [[-0.22, -0.64], [-0.02, -0.66], [0.2, -0.6], [0.27, -0.52], [0.25, -0.42], [0.0, -0.4], [-0.2, -0.41], [-0.27, -0.5]]);
    poly(path, [[-0.27, -0.5], [-0.13, -0.63], [-0.27, -0.97], [-0.345, -0.94]]);
    blob(path, [[-0.265, -0.985], [-0.33, -0.995], [-0.43, -0.94], [-0.475, -0.905], [-0.45, -0.875], [-0.345, -0.895], [-0.285, -0.93]]);
    poly(path, [[-0.3, -0.985], [-0.296, -1.045], [-0.282, -1.045], [-0.286, -0.985]]);
    poly(path, [[-0.33, -0.99], [-0.33, -1.045], [-0.316, -1.045], [-0.318, -0.99]]);
    poly(path, [[-0.268, -0.98], [-0.21, -1.005], [-0.252, -0.95]]);
    const hips = [-0.19, -0.11, 0.15, 0.23];
    const beat = [0, Math.PI, Math.PI, 0];
    for (let i = 0; i < 4; i++) {
      const swing = stride * 0.085 * Math.sin(phase + beat[i]);
      const lift = stride * Math.max(0, 0.04 * Math.cos(phase + beat[i]));
      const x = hips[i];
      poly(path, [[x - 0.028, -0.44], [x + 0.028, -0.44], [x + swing + 0.017, -lift], [x + swing - 0.017, -lift]]);
    }
    poly(path, [[0.255, -0.55], [0.27, -0.55], [0.31, -0.32], [0.296, -0.31]]);
    blob(path, [[0.295, -0.33], [0.32, -0.31], [0.315, -0.26], [0.29, -0.27]]);
    return path;
  };
  const CALF_EYE = [-0.375, -0.945, 0.024];
  const CALF_NECK = [[-0.2, -0.58], [-0.305, -0.955]];
  const CALF_HEAD = [-0.38, -0.94];

  // Speckle that sits over everything, like ink on paper.
  const makeGrain = () => {
    const size = 192;
    const tile = document.createElement('canvas');
    tile.width = size;
    tile.height = size;
    const c = tile.getContext('2d');
    const img = c.createImageData(size, size);
    const rand = Util.rng(77);
    for (let i = 0; i < size * size; i++) {
      const v = rand();
      const a = rand();
      const o = i * 4;
      if (v < 0.11) {
        img.data[o] = 20; img.data[o + 1] = 28; img.data[o + 2] = 74; img.data[o + 3] = 20 + a * 60;
      } else if (v > 0.93) {
        img.data[o] = 242; img.data[o + 1] = 232; img.data[o + 2] = 213; img.data[o + 3] = 12 + a * 44;
      }
    }
    c.putImageData(img, 0, 0);
    return tile;
  };

  const build = (w, h, seed, dpr) => {
    const s = Math.min(w, h * 0.56);
    const rand = Util.rng(seed * 7919 + 13);
    const horizon = Math.round(h * 0.62);
    const giraffe = makeGiraffe(s, h, rand);

    // Hills along the horizon, in two rows.
    const hillRow = (height, k1, k2, p1, p2) => {
      const path = new Path2D();
      path.moveTo(-10, horizon + 3);
      for (let x = -10; x <= w + 10; x += Math.max(6, w / 90)) {
        const y = horizon - height * h * (0.55 + 0.3 * Math.sin((x / s) * k1 + p1) + 0.15 * Math.sin((x / s) * k2 + p2));
        path.lineTo(x, y);
      }
      path.lineTo(w + 10, horizon + 3);
      path.closePath();
      return path;
    };
    const hills = {
      far: hillRow(0.052, 5.6, 12.7, rand() * TAU, rand() * TAU),
      near: hillRow(0.026, 7.9, 17.3, rand() * TAU, rand() * TAU),
    };

    // Acacias on the horizon, to the right of her.
    const trees = new Path2D();
    for (let x = 0.58 * s + rand() * 0.06 * s; x < w + 0.1 * s; x += Util.lerp(0.3, 0.52, rand()) * s) {
      const H = Util.lerp(0.105, 0.17, rand()) * s;
      const W = H * Util.lerp(1.15, 1.5, rand());
      const lean = (rand() - 0.5) * 0.14 * H;
      const y = horizon + 2;
      poly(trees, [[x - 0.03 * H, y], [x + 0.03 * H, y], [x + lean + 0.014 * H, y - 0.7 * H], [x + lean - 0.014 * H, y - 0.7 * H]]);
      poly(trees, [[x + lean * 0.5, y - 0.38 * H], [x + lean * 0.5 + 0.02 * H, y - 0.4 * H], [x + lean + 0.3 * W, y - 0.7 * H], [x + lean + 0.27 * W, y - 0.7 * H]]);
      poly(trees, [[x + lean * 0.4, y - 0.3 * H], [x + lean * 0.4 - 0.02 * H, y - 0.32 * H], [x + lean - 0.28 * W, y - 0.7 * H], [x + lean - 0.25 * W, y - 0.7 * H]]);
      const cx = x + lean;
      blob(trees, [
        [cx - 0.52 * W, y - 0.71 * H], [cx - 0.3 * W, y - 0.88 * H], [cx, y - 0.93 * H], [cx + 0.32 * W, y - 0.89 * H],
        [cx + 0.54 * W, y - 0.73 * H], [cx + 0.3 * W, y - 0.66 * H], [cx, y - 0.65 * H], [cx - 0.3 * W, y - 0.66 * H],
      ]);
    }

    // Grass marks and flowers on the ground, bigger toward the viewer.
    const marks = [];
    const count = Math.round(150 * (w / s));
    for (let i = 0; i < count; i++) {
      const depth = Math.pow(rand(), 0.8);
      marks.push({ x: rand() * w, y: Util.lerp(horizon + 0.025 * h, h, depth), k: Util.lerp(0.35, 1, depth) * 0.02 * s, lean: rand() - 0.5, flower: rand() < 0.22 });
    }

    const stars = [];
    const starCount = Math.round((w * (horizon - 0.075 * h)) / 1900);   // the same density on every screen
    for (let i = 0; i < starCount; i++) {
      const size = rand();
      stars.push({
        x: rand() * w,
        y: Util.lerp(0.012 * h, horizon - 0.075 * h, Math.pow(rand(), 1.25)),
        r: (size < 0.62 ? 0.8 : size < 0.92 ? 1.25 : 1.9) * Math.max(1, s / 420),
        phase: rand() * TAU,
        speed: Util.lerp(0.7, 2.2, rand()),
        cross: size > 0.955,
      });
    }
    const moon = { x: w - 0.16 * s, y: 0.085 * h, r: 0.045 * s };
    const sun = { x: Math.max(0.72 * w, w - 0.6 * s), r: 0.115 * s };

    const calfHeight = (y) => 0.21 * s * Util.lerp(0.42, 1, Util.clamp((y - horizon) / (0.965 * h - horizon), 0, 1));

    // Where a calf stands once it is home: rows beside the mother.
    const homeSpot = (i) => {
      const row = Math.floor(i / 4);
      const col = i % 4;
      // Clear of the bottom edge, where a phone's browser bar can sit over the page.
      const y = (0.905 - row * 0.038) * h;
      return { x: (0.47 + col * 0.128 + (row % 2) * 0.064) * s, y, height: calfHeight(y) };
    };

    // Where a calf waits: out in the dark, farther for a longer walk.
    const startSpot = (lane, dist) => {
      const far = Util.clamp((dist - 2.5) / 3, 0, 1);
      const y = Util.lerp(0.8, 0.69, far) * h;
      const span = w - 0.52 * s;
      const x = 0.52 * s + span * [0.62, 0.3, 0.88][lane] + far * 0.04 * s;
      return { x, y, height: calfHeight(y) };
    };

    const drawMarks = (c, ink, flowerInk) => {
      c.lineCap = 'round';
      for (const m of marks) {
        if (m.flower && flowerInk) {
          c.fillStyle = flowerInk;
          c.beginPath();
          c.arc(m.x, m.y - m.k * 0.4, m.k * 0.2, 0, TAU);
          c.fill();
          continue;
        }
        c.strokeStyle = ink;
        c.lineWidth = Math.max(0.8, m.k * 0.12);
        c.beginPath();
        for (const a of [-0.55, 0, 0.5]) {
          c.moveTo(m.x, m.y);
          c.lineTo(m.x + (a + m.lean * 0.5) * m.k, m.y - m.k * (1 - Math.abs(a) * 0.5));
        }
        c.stroke();
      }
    };

    const layer = () => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const c = canvas.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { canvas, c };
    };

    // The lit world: what the light uncovers. Gold on paper.
    const lit = layer();
    lit.c.fillStyle = INK.paper;
    lit.c.fillRect(0, 0, w, h);
    lit.c.fillStyle = rgba(INK.gold, 0.4);
    lit.c.fillRect(0, horizon, w, h - horizon);
    lit.c.fillStyle = rgba(INK.gold, 0.5);
    lit.c.fill(hills.far);
    lit.c.fillStyle = INK.gold;
    lit.c.fill(hills.near);
    drawMarks(lit.c, INK.gold, INK.paper);
    lit.c.fillStyle = INK.deep;
    lit.c.fill(trees);

    // The night: a flood of blue, with the stars and moon left as bare paper.
    const night = layer();
    night.c.fillStyle = INK.blue;
    night.c.fillRect(0, 0, w, h);
    night.c.fillStyle = rgba(INK.deep, 0.3);
    night.c.fillRect(0, horizon, w, h - horizon);
    night.c.fillStyle = INK.paper;
    for (const st of stars) {
      night.c.beginPath();
      night.c.arc(st.x, st.y, st.r, 0, TAU);
      night.c.fill();
      if (st.cross) {
        night.c.fillRect(st.x - st.r * 3.2, st.y - 0.35, st.r * 6.4, 0.7);
        night.c.fillRect(st.x - 0.35, st.y - st.r * 3.2, 0.7, st.r * 6.4);
      }
    }
    night.c.beginPath();
    night.c.arc(moon.x, moon.y, moon.r, 0, TAU);
    night.c.fill();
    night.c.fillStyle = INK.blue;
    night.c.beginPath();
    night.c.arc(moon.x + moon.r * 0.42, moon.y - moon.r * 0.14, moon.r * 0.94, 0, TAU);
    night.c.fill();
    night.c.fillStyle = rgba(INK.deep, 0.55);
    night.c.fill(hills.far);
    night.c.fillStyle = INK.deep;
    night.c.fill(hills.near);
    night.c.fill(trees);
    drawMarks(night.c, rgba(INK.deep, 0.9), null);

    return {
      w, h, s, dpr, horizon,
      neck: giraffe.neck,
      neckAt: giraffe.neckAt,
      giraffe,
      pool: { x: 0.27 * s, y: 0.9 * h },
      hills, trees, stars, moon, sun,
      homeSpot, startSpot, calfHeight,
      lit: lit.canvas,
      night: night.canvas,
    };
  };

  // A screen y mapped onto the neck: 0 at the shoulder, 1 at the throat.
  const touchT = (scene, y) => Util.clamp((scene.neck.base.y - y) / (scene.neck.base.y - scene.neck.throat.y), 0, 1);

  return { INK, TAU, rgba, poly, blob, build, touchT, calfPath, makeGrain, CALF_EYE, CALF_NECK, CALF_HEAD };
})();

// Draws one frame. The lit world goes down first. The night goes over it with
// holes punched where there is light, so humming takes ink away instead of
// adding glow. Then the giraffes, the rings on the neck, and the grain.
const Render = (() => {
  const INK = Art.INK;
  const TAU = Math.PI * 2;
  const toward = (dt, tau) => 1 - Math.exp(-dt / tau);

  const create = (canvas) => {
    const ctx = canvas.getContext('2d', { alpha: false });
    const work = document.createElement('canvas');
    const wctx = work.getContext('2d');
    const standing = Art.calfPath(0, 0);
    let scene = null;
    let seed = 1;
    let dpr = 1;
    let grain = null;
    let last = 0;
    let game = null;

    // Values that ease toward the game's, so nothing jumps.
    // The light is a liquid: fill is its surface. 1 is the throat, 0 the
    // shoulder, and below 0 it drains down through her body to empty at -0.5.
    let fill = -0.5;
    let sing = 0;
    let pool = 0;
    let breath = 0;
    let calves = new Map();   // id -> { born, phase, last, stride, lit, blink }
    let glow = new Map();     // id -> the time its bowl rings

    // Sizes everything from the canvas's own box, which is what the player
    // sees. On a phone that box and the window do not always agree.
    const resize = () => {
      const w = canvas.clientWidth || window.innerWidth;
      const h = canvas.clientHeight || window.innerHeight;
      let ratio = Math.min(window.devicePixelRatio || 1, 2);
      while (w * h * ratio * ratio > 3.4e6 && ratio > 1) ratio -= 0.25;
      if (scene && scene.w === w && scene.h === h && ratio === dpr) return;
      dpr = ratio;
      // Phones cap the memory all canvases share, and a dropped canvas is
      // only freed later. Emptying the old layers frees them now.
      if (scene) {
        scene.lit.width = 0;
        scene.night.width = 0;
      }
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      work.width = canvas.width;
      work.height = canvas.height;
      scene = Art.build(w, h, seed, dpr);
      if (!grain) grain = ctx.createPattern(Art.makeGrain(), 'repeat');
    };

    // A halftone: dots on a 45 degree grid, each sized by how open the night
    // is at that spot. The grid is fixed to the page, so the dots swell and
    // shrink in place like a print, instead of sliding.
    const punch = (c, x0, y0, x1, y1, cell, scale, intensity) => {
      const d = cell / Math.SQRT2;
      c.beginPath();
      for (let iy = Math.floor(y0 / d); iy <= Math.ceil(y1 / d); iy++) {
        for (let ix = Math.floor(x0 / d); ix <= Math.ceil(x1 / d); ix++) {
          if ((ix + iy) & 1) continue;
          const x = ix * d;
          const y = iy * d;
          const amount = intensity(x, y);
          if (amount <= 0.004) continue;
          const r = scale * cell * Math.sqrt(Math.min(1, amount));
          c.moveTo(x + r, y);
          c.arc(x, y, r, 0, TAU);
        }
      }
      c.fill();
    };

    const draw = (view) => {
      const sc = scene;
      const { w, h, s, horizon } = sc;
      const g = view.mode === 'title' ? null : view.game;
      const t = view.time;
      const dt = Util.clamp(t - last, 0, 0.1);
      last = t;
      const calm = !!view.reducedMotion;
      if (g !== game) {
        game = g;
        calves = new Map();
        glow = new Map();
        fill = -0.5;
      }

      // ---- ease
      const sunrise = g && (g.state === 'sunrise' || g.state === 'end') ? Util.clamp(g.clock.sunrise / Game.K.SUNRISE, 0, 1) : 0;
      const dawn = sunrise > 0 ? 1 : g && g.state === 'dawn' ? Util.clamp(g.clock.dawn / 5, 0, 1) : 0;
      const on = !!(g && g.light.on && sunrise === 0);
      // During the sunrise her neck shows the real giraffe's hum, on its own note.
      const singing = sunrise > 0 && sunrise < 0.96;
      // Then, as the sun clears the hills, the light climbs to the top and stays.
      const want = on ? Notes.axisT(g.light.st) : sunrise > 0.55 ? 1.03 : singing ? Notes.axisT(g.giraffe) : -0.5;
      fill += (want - fill) * toward(dt, on ? 0.07 : sunrise > 0.55 ? 0.7 : singing ? 0.25 : 0.32);
      sing += ((on || singing ? 1 : 0) - sing) * toward(dt, 0.1);
      pool += ((g ? g.energy : 0) - pool) * toward(dt, 0.25);
      breath += ((on ? Util.clamp(view.level * 6, 0, 1) : 0) - breath) * toward(dt, 0.12);
      const open = Util.smoothstep(0.02, 0.86, sunrise);

      // ---- 1. the lit world, a touch out of register with the night
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = INK.paper;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sc.lit, 0, 0);
      ctx.drawImage(sc.lit, Math.round(1.5 * dpr), Math.round(-dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // The sun comes up behind hills that the dawn has turned rose.
      if (sunrise > 0) {
        const rise = Util.smoothstep(0.08, 0.95, sunrise);
        ctx.fillStyle = INK.gold;
        ctx.beginPath();
        ctx.arc(sc.sun.x, horizon + sc.sun.r - rise * (sc.sun.r + 0.034 * h), sc.sun.r, 0, TAU);
        ctx.fill();
        ctx.fillStyle = Art.rgba(INK.rose, 0.55);
        ctx.fill(sc.hills.far);
        ctx.fillStyle = INK.rose;
        ctx.fill(sc.hills.near);
        ctx.fillStyle = INK.deep;
        ctx.fill(sc.trees);
      }

      // ---- 2. the night, with holes where there is light
      wctx.setTransform(1, 0, 0, 1, 0, 0);
      wctx.globalCompositeOperation = 'copy';
      wctx.drawImage(sc.night, 0, 0);
      wctx.globalCompositeOperation = 'destination-out';
      wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      wctx.fillStyle = '#000';
      const cell = Math.max(7, Math.round(0.022 * s));

      if (g && pool > 0.002) {
        const herd = Math.min(g.herd.length, 12);
        const reach = Util.lerp(0.14 * s, Math.max(1.25 * s, 0.72 * w), Util.smoothstep(0, 1, pool));
        const rx = reach * Util.smoothstep(0, 0.05, pool) * (1 + 0.04 * herd) * (1 + (calm ? 0 : 0.035 * breath));
        const ry = Math.min(0.42 * rx, (sc.pool.y - horizon) / 1.08);
        const px = sc.pool.x;
        const py = sc.pool.y;
        wctx.beginPath();
        wctx.ellipse(px, py, rx * 0.58, ry * 0.58, 0, 0, TAU);
        wctx.fill();
        punch(wctx, px - rx * 1.06, py - ry * 1.06, px + rx * 1.06, py + ry * 1.06, cell, 0.72, (x, y) => {
          const d = Math.hypot((x - px) / rx, (y - py) / ry);
          return d < 0.55 ? 0 : Util.smoothstep(1.05, 0.6, d);
        });
      }

      // Sunrise: the night pulls back from the horizon, up the sky and down the ground.
      let skyEdge = -1;
      if (open > 0) {
        const band = 0.16 * h;
        const up = horizon - open * (horizon + band + 0.02 * h);
        const down = horizon + open * (h - horizon + band + 0.02 * h);
        skyEdge = up + band * 0.5;
        if (up + band < down - band) wctx.fillRect(0, up + band, w, down - up - 2 * band);
        punch(wctx, 0, up, w, up + band, cell, 0.72, (x, y) => Math.pow(Util.clamp((y - up) / band, 0, 1), 1.3));
        punch(wctx, 0, down - band, w, down, cell, 0.72, (x, y) => Math.pow(Util.clamp((down - y) / band, 0, 1), 1.3));
      }

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(work, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // ---- 3. the third ink: rose, printed last, and only from dawn
      if (dawn > 0) {
        const tall = h * (0.09 * dawn + 0.34 * Util.smoothstep(0, 1, sunrise));
        const top = horizon - tall;
        ctx.fillStyle = INK.rose;
        punch(ctx, 0, top, w, horizon, Math.max(7, Math.round(0.026 * s)), 0.5, (x, y) => (y > horizon ? 0 : Math.pow(Util.clamp((y - top) / tall, 0, 1), 1.5)));
        // Before the sun is up, the dark hills still stand in front of the rose.
        if (sunrise === 0) {
          ctx.fillStyle = Art.rgba(INK.deep, 0.55);
          ctx.fill(sc.hills.far);
          ctx.fillStyle = INK.deep;
          ctx.fill(sc.hills.near);
        }
        ctx.fillStyle = INK.deep;
        ctx.fill(sc.trees);
      }

      // Stars twinkle wherever the night is still there.
      if (!calm) {
        ctx.fillStyle = INK.paper;
        for (const st of sc.stars) {
          if (skyEdge >= 0 && st.y > skyEdge) continue;
          const a = 0.5 + 0.5 * Math.sin(t * st.speed + st.phase);
          if (a < 0.55) continue;
          ctx.globalAlpha = (a - 0.55) * 1.6;
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r * (1 + a * 0.9), 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // ---- 4. calves, far ones first
      const placed = new Map();
      const order = [];
      if (g) {
        for (const c of g.calves) {
          let m = calves.get(c.id);
          if (!m) {
            m = { born: t, phase: (c.id * 1.7) % TAU, last: c.progress, stride: 0, lit: 0, blink: (c.id * 0.37) % 1 };
            calves.set(c.id, m);
          }
          const moving = c.progress > m.last + 1e-7 && c.state !== 'home';
          m.last = c.progress;
          m.stride += ((moving ? 1 : 0) - m.stride) * toward(dt, 0.15);
          m.lit += ((c.active ? 1 : 0) - m.lit) * toward(dt, 0.12);
          if (!calm) m.phase += dt * 9.5 * m.stride;
          const a = sc.startSpot(c.lane, c.dist);
          const b = sc.homeSpot(c.index);
          const e = c.state === 'home' ? 1 : Util.smoothstep(0, 1, c.progress);
          const y = Util.lerp(a.y, b.y, e);
          const item = { c, m, x: Util.lerp(a.x, b.x, e), y, H: sc.calfHeight(y), flip: c.state === 'home' && c.index % 3 === 2 ? -1 : 1 };
          placed.set(c.id, item);
          order.push(item);
        }
        order.sort((p, q) => p.y - q.y);
      }
      for (const { c, m, x, y, H, flip } of order) {
        const bob = calm ? 0 : Math.abs(Math.sin(m.phase)) * 0.014 * H * m.stride;
        ctx.save();
        ctx.translate(x, y - bob);
        ctx.scale(H * flip, H);
        ctx.globalAlpha = Util.clamp((t - m.born) / 1.2, 0, 1);
        ctx.fillStyle = INK.deep;
        ctx.fill(m.stride > 0.02 ? Art.calfPath(m.phase, m.stride) : standing);
        // Its own light: a gold line up the neck while it is called, and when its bowl rings.
        const rang = glow.has(c.id) && t >= glow.get(c.id) ? Math.exp(-(t - glow.get(c.id)) / 1.1) : 0;
        const lit = Math.max(m.lit, rang, c.state === 'stray' ? 0.85 : 0);
        if (lit > 0.04) {
          ctx.globalAlpha = 1;
          ctx.strokeStyle = INK.gold;
          ctx.lineWidth = 0.055 * lit;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(Art.CALF_NECK[0][0], Art.CALF_NECK[0][1]);
          ctx.lineTo(Art.CALF_NECK[1][0], Art.CALF_NECK[1][1]);
          ctx.stroke();
        }
        if (calm || (t * 0.31 + m.blink) % 1 > 0.045) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = INK.paper;
          ctx.beginPath();
          ctx.arc(Art.CALF_EYE[0], Art.CALF_EYE[1], Art.CALF_EYE[2], 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      // ---- 5. the mother. Her shape is night blue, her patches a deeper blue,
      // and the light shows only in the pale lines between them.
      const gf = sc.giraffe;
      const edge = (tt, side) => {
        const p = sc.neckAt(tt);
        return [p.x + p.nx * p.width * side, p.y + p.ny * p.width * side];
      };
      ctx.save();
      ctx.clip(gf.silhouette);
      ctx.fillStyle = INK.blue;
      ctx.fillRect(-0.1 * s, 0, 0.82 * s, h * 1.06);
      if (fill > -0.495) {
        // Gold is never thinned: it is there or it is not, like ink.
        ctx.fillStyle = INK.gold;
        const surface = [];
        if (fill <= 0) {
          const y = Util.lerp(gf.chestY, h * 1.06, -fill / 0.5);
          ctx.fillRect(-0.1 * s, y, 0.82 * s, h * 1.1 - y);
          for (let j = 0; j <= 8; j++) surface.push([-0.1 * s + (0.6 * s * j) / 8, y + (calm ? 0 : Math.sin(t * 5.2 + j * 1.3) * 1.5)]);
        } else {
          ctx.fillRect(-0.1 * s, gf.chestY, 0.82 * s, h);
          // Full to the brim: her head lights too.
          if (fill > 1.012) ctx.fillRect(-0.1 * s, 0, 0.82 * s, sc.neck.throat.y + 0.08 * s);
          const top = sc.neckAt(fill);
          for (let j = 0; j <= 6; j++) {
            const u = -0.56 + (1.12 * j) / 6;
            const wave = calm ? 0 : Math.sin(t * 5.2 + j * 1.3) * (1 + 3 * breath);
            surface.push([top.x + top.nx * top.width * u + top.ny * wave, top.y + top.ny * top.width * u - top.nx * wave]);
          }
          ctx.beginPath();
          for (let i = 0; i <= 20; i++) {
            const p = edge(-0.06 + ((fill + 0.06) * i) / 20, -0.56);
            if (i) ctx.lineTo(p[0], p[1]);
            else ctx.moveTo(p[0], p[1]);
          }
          for (const p of surface) ctx.lineTo(p[0], p[1]);
          for (let i = 20; i >= 0; i--) {
            const p = edge(-0.06 + ((fill + 0.06) * i) / 20, 0.56);
            ctx.lineTo(p[0], p[1]);
          }
          ctx.closePath();
          ctx.fill();

          // Rungs above the surface: the real harmonics of the hum. A louder
          // harmonic is a thicker rung.
          ctx.strokeStyle = INK.gold;
          ctx.lineCap = 'butt';
          for (let k = 0; k < 8; k++) {
            const thick = view.harmonics[k] * sing * Math.max(4.5, 0.02 * s);
            if (thick < 0.8) continue;
            const a = edge(fill + (1 - fill) * (Math.log2(k + 2) / Math.log2(10)), -0.56);
            const b = edge(fill + (1 - fill) * (Math.log2(k + 2) / Math.log2(10)), 0.56);
            ctx.lineWidth = thick;
            ctx.beginPath();
            ctx.moveTo(a[0], a[1]);
            ctx.lineTo(b[0], b[1]);
            ctx.stroke();
          }
        }
        ctx.strokeStyle = INK.paper;
        ctx.lineWidth = Math.max(2, 0.008 * s);
        ctx.beginPath();
        surface.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = INK.deep;
      ctx.fill(gf.patches);
      ctx.fill(gf.solid);
      ctx.restore();

      // Her eye closes while she hums.
      ctx.fillStyle = INK.deep;
      ctx.beginPath();
      ctx.arc(gf.eye.x, gf.eye.y, gf.eye.r * 2.3, 0, TAU);
      ctx.fill();
      if (sing > 0.5) {
        ctx.strokeStyle = INK.paper;
        ctx.lineWidth = Math.max(1.2, gf.eye.r * 0.5);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(gf.eye.x, gf.eye.y - gf.eye.r * 0.5, gf.eye.r * 1.3, 0.18 * Math.PI, 0.82 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = INK.paper;
        ctx.beginPath();
        ctx.arc(gf.eye.x, gf.eye.y, gf.eye.r, 0, TAU);
        ctx.fill();
      }

      // ---- 6. rings on the neck, and the threads to whoever answers to them
      if (g && (g.state === 'night' || g.state === 'dawn')) {
        const pad = 0.014 * s;
        const hoop = (tt, grow) => {
          const p = sc.neckAt(Util.clamp(tt, 0, 1));
          const half = p.width / 2 + pad + grow;
          return {
            l: [p.x - p.nx * half, p.y - p.ny * half],
            r: [p.x + p.nx * half, p.y + p.ny * half],
            c: [p.x - p.ny * half * 0.5, p.y + p.nx * half * 0.5],
          };
        };
        // Every line is cased in deep blue, so it reads on the night and on the lit ground.
        const cased = (ink, width, trace) => {
          ctx.lineCap = 'round';
          ctx.strokeStyle = INK.deep;
          ctx.lineWidth = width + (width < 1.5 ? 1.6 : 2.6);
          trace();
          ctx.stroke();
          ctx.strokeStyle = ink;
          ctx.lineWidth = width;
          trace();
          ctx.stroke();
        };
        const sleeve = (centre, halfWidth, o) => {
          const ta = Notes.axisT(centre - halfWidth);
          const tb = Notes.axisT(centre + halfWidth);
          const a = hoop(ta, 0);
          const b = hoop(tb, 0);
          cased(o.ink, o.width * 0.55, () => {
            ctx.beginPath();
            ctx.moveTo(a.l[0], a.l[1]);
            ctx.lineTo(b.l[0], b.l[1]);
            ctx.moveTo(a.r[0], a.r[1]);
            ctx.lineTo(b.r[0], b.r[1]);
          });
          const hoops = [a, b];
          // The giraffe's own note fills with rungs as it is held.
          for (let i = 1; i <= (o.rungs || 0); i++) hoops.push(hoop(Util.lerp(ta, tb, i / 8), -pad * 0.6));
          if (o.double) hoops.push(hoop(ta - 0.013, 0), hoop(tb + 0.013, 0));
          for (const e of hoops) {
            cased(o.ink, o.width, () => {
              ctx.beginPath();
              ctx.moveTo(e.l[0], e.l[1]);
              ctx.quadraticCurveTo(e.c[0], e.c[1], e.r[0], e.r[1]);
            });
          }
        };
        const thread = (centre, to, active, ink) => {
          const p = sc.neckAt(Util.clamp(Notes.axisT(centre), 0, 1));
          const from = [p.x + p.nx * (p.width / 2 + pad), p.y + p.ny * (p.width / 2 + pad)];
          const span = Math.hypot(to[0] - from[0], to[1] - from[1]);
          const cx = (from[0] + to[0]) / 2;
          const cy = (from[1] + to[1]) / 2 + Math.min(0.09 * h, 0.22 * span);
          ctx.setLineDash(active ? [] : [0.5, 7]);
          cased(ink, active ? 2.2 : 2.4, () => {
            ctx.beginPath();
            ctx.moveTo(from[0], from[1]);
            ctx.quadraticCurveTo(cx, cy, to[0], to[1]);
          });
          ctx.setLineDash([]);
          if (active && !calm) {
            const u = (t * 1.25) % 1;
            const v = 1 - u;
            const bx = v * v * from[0] + 2 * u * v * cx + u * u * to[0];
            const by = v * v * from[1] + 2 * u * v * cy + u * u * to[1];
            ctx.fillStyle = INK.deep;
            ctx.beginPath();
            ctx.arc(bx, by, 5, 0, TAU);
            ctx.fill();
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.arc(bx, by, 3.4, 0, TAU);
            ctx.fill();
          }
        };

        for (const target of g.targets()) {
          const rings = Notes.rings(target.offset);
          const main = Notes.nearestRing(target.offset, target.offset);
          if (target.kind === 'giraffe') {
            const held = Util.clamp(g.held / Game.K.HOLD, 0, 1);
            for (const ring of rings) {
              const first = ring === main;
              sleeve(ring, target.halfWidth, { ink: INK.gold, width: first ? 2.6 : 1, double: first, rungs: first ? Math.round(held * 7) : 0 });
            }
            thread(main, [sc.sun.x, horizon - 2], target.active, INK.gold);
            continue;
          }
          const item = placed.get(target.id);
          const lit = item ? item.m.lit : 0;
          for (const ring of rings) {
            const first = ring === main;
            sleeve(ring, target.halfWidth, { ink: lit > 0.5 ? INK.gold : INK.paper, width: first ? Util.lerp(1.8, 3.2, lit) : 1 });
          }
          if (item) thread(main, [item.x + Art.CALF_HEAD[0] * item.H * item.flip, item.y + Art.CALF_HEAD[1] * item.H], lit > 0.5, lit > 0.5 ? INK.gold : INK.paper);
        }
        ctx.globalAlpha = 1;
      }

      // ---- 7. grain over everything
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = grain;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    };

    return {
      resize,
      draw,
      // A calf's neck lights when its bowl is struck.
      ring(id, when) {
        glow.set(id, when);
      },
      set seed(n) {
        seed = n;
      },
      get scene() {
        return scene;
      },
    };
  };

  return { create };
})();

// Boot: the screens, the two ways to hum (mic or finger), and the frame loop
// that feeds the hum to the game and the game to the sound and the picture.
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const fakeHz = Number(params.get('fakemic')) || null;
  const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const SILENT = { voiced: false, freq: 0, level: 0, clarity: 0 };
  const SPAN = Notes.AXIS_HI - Notes.AXIS_LO;

  const stage = $('stage');
  const r = Render.create(stage);
  const rungs = new Float32Array(8);
  let mode = 'title';       // 'title' | 'mic' | 'touch'
  let game = null;
  let seed = Number(params.get('seed')) || (Date.now() % 100000) + 1;
  let clock = 0;
  let lastFrame = 0;
  let input = SILENT;
  let override;             // a test can stand in for the hum
  let heard = false;        // has the mic heard a hum this night?
  let touched = false;
  let deafUntil = 0;        // the mic is ignored until the last night's sound has died
  let asleepFor = 0;        // how long the phone has had the sound paused
  let lastError = '';
  const finger = { down: false, key: false, slide: 0, st: 0 };

  // Words on screen. Setting the same words again does nothing, so they do
  // not re-animate every frame.
