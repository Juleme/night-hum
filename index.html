  const say = (el, text) => {
    const next = text || '';
    if (el.dataset.said === next) return;
    el.dataset.said = next;
    el.hidden = !next;
    el.textContent = next;
    el.classList.toggle('long', next.length > 12);
  };

  const newNight = (how) => {
    mode = how;
    game = Game.create({ seed, fixedHome: how === 'touch' ? Game.K.TOUCH_HOME : null });
    seed += 1;
    heard = false;
    touched = false;
    finger.down = false;
    finger.key = false;
    finger.st = 0;
    // Whatever is still ringing from the last night must not be heard as a hum.
    Sound.hush();
    deafUntil = clock + 0.7;
    if (how === 'mic') Sound.clearHome();
    $('title').hidden = true;
    $('end').hidden = true;
    $('escape').hidden = true;
    Sound.startNight();
  };

  // Both start buttons land here. The audio context has to be created inside
  // the tap, before anything is awaited.
  let starting = false;
  const begin = async (wantMic) => {
    if (starting) return;
    starting = true;
    let mic = false;
    try {
      Sound.session(wantMic ? 'auto' : 'playback');
      const ready = Sound.init();
      if (params.has('mute')) Sound.mute(true);
      await ready;
      if (wantMic) mic = Sound.hasMic() || (await Sound.startMic({ fake: fakeHz }));
      else Sound.stopMic();
    } catch (err) {
      // No sound is not a reason to stop the game: it plays silently by touch.
    }
    // Without the mic, an iPhone would mute the game with its ring/silent switch.
    if (!mic) Sound.session('playback');
    starting = false;
    newNight(mic ? 'mic' : 'touch');
  };

  const readInput = (dt) => {
    if (override !== undefined) return override;
    if (mode === 'mic') {
      const now = Sound.read();
      return clock < deafUntil ? SILENT : now;
    }
    if (finger.key) finger.st = Util.clamp(finger.st + finger.slide * 6 * dt, Notes.AXIS_LO, Notes.AXIS_HI - 0.01);
    if (!finger.down && !finger.key) return SILENT;
    return { voiced: true, freq: Notes.freq(finger.st, game.home), level: 0.1, clarity: 1 };
  };

  const showEnd = () => {
    const count = $('end-count');
    count.textContent = '';
    if (game.score > 0) {
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(game.score);
      count.append(n, ' came home.');
    } else {
      count.textContent = 'They heard you. Try a longer hum.';
    }
    $('end-hum').hidden = mode !== 'mic';
    $('end-hum').textContent = `You hum at ${Math.round(game.home)} Hz. Giraffes hum at 92.`;
    $('end').hidden = false;
  };

  const handle = (e) => {
    if (e.type === 'homeSet') {
      Sound.setHome(e.home, e.level);
    } else if (e.type === 'home') {
      Sound.strike(e, 0.8);
      r.ring(e.id, clock);
    } else if (e.type === 'answer') {
      // The herd answers: the twelve most recent arrivals, one after another.
      Sound.answer(e.notes.slice(-12));
      game.herd.slice(-12).forEach((c, i) => r.ring(c.id, clock + i * 0.12));
    } else if (e.type === 'sunrise') {
      Sound.stopNight();
      Sound.playGiraffe();
    } else if (e.type === 'end') {
      showEnd();
    }
  };

  const words = () => {
    const playing = game.state === 'listen' || game.state === 'night' || game.state === 'dawn';
    const waitingForTouch = mode === 'touch' && !touched && game.state === 'night';
    say($('prompt'), !playing ? '' : waitingForTouch ? 'Slide a finger up the neck.' : game.prompt);
    const stuck = mode === 'mic' && game.state === 'listen';
    say($('sub'), !playing ? '' : stuck && game.clock.listen > 8 ? 'Any note. Lips closed. Hold it.' : game.hint);
    $('escape').hidden = !(stuck && game.clock.listen > 14 && !heard);
  };

  const step = (dt) => {
    clock += dt;
    if (!game) return;

    // An iPhone can pause the sound, and the mic goes quiet with it. The night
    // waits for a tap instead of running out unheard.
    asleepFor = Sound.asleep() ? asleepFor + dt : 0;
    if (mode === 'mic' && override === undefined && asleepFor > 0.5 && game.state !== 'end') {
      Sound.wake();
      say($('prompt'), 'Tap once to wake the sound.');
      say($('sub'), '');
      $('escape').hidden = true;
      input = SILENT;
      return;
    }

    input = readInput(dt);
    if (input.voiced) heard = true;
    game.update(dt, input);
    for (const e of game.drain()) handle(e);
    words();
    if (mode === 'touch') Sound.touchHum(input.voiced && (game.state === 'night' || game.state === 'dawn'), input.freq);
  };

  const render = () => {
    if (game && game.state === 'sunrise') Sound.harmonics(Notes.GIRAFFE_HZ, rungs, 'giraffe');
    else if (!game || !input.voiced) rungs.fill(0);
    else Sound.harmonics(input.freq, rungs, mode === 'mic' && override === undefined ? 'mic' : 'touch');
    r.draw({ time: clock, game, harmonics: rungs, level: input.level, mode, reducedMotion: reduced });
  };

  // ---- ?debug: what the device is actually doing, readable on the phone itself
  let readout = null;
  let frames = 0;
  let fps = 0;
  let fpsAt = 0;
  if (params.has('debug')) {
    readout = document.createElement('pre');
    readout.id = 'debug';
    readout.style.cssText = 'position:fixed;left:6px;top:calc(6px + env(safe-area-inset-top));margin:0;padding:6px 8px;z-index:9;'
      + 'font:11px/1.4 ui-monospace,Menlo,monospace;color:#F2E8D5;background:rgba(20,28,74,.86);pointer-events:none;white-space:pre';
    document.body.appendChild(readout);
  }
  const report = (now) => {
    frames += 1;
    if (now - fpsAt < 500) return;
    fps = Math.round((frames * 1000) / (now - fpsAt));
    frames = 0;
    fpsAt = now;
    const d = Sound.debug();
    const yn = (v) => (v === undefined || v === null ? '?' : v ? 'on' : 'off');
    readout.textContent = [
      `${mode} | ${game ? game.state : 'title'} | ${fps} fps`,
      `sound ${d.context} ${d.rate} Hz | session ${d.session}`,
      `mic ${d.mic} | echo ${yn(d.echo)} noise ${yn(d.noise)} agc ${yn(d.agc)}${d.micRate ? ` | ${d.micRate} Hz` : ''}`,
      `level ${input.level.toFixed(4)} | floor ${d.floor.toFixed(4)} | gate ${d.gate.toFixed(4)}`,
      `clear ${(input.clarity || 0).toFixed(2)} | ${input.freq ? `${input.freq.toFixed(1)} Hz` : 'no pitch'} | ${input.voiced ? 'HUM' : 'quiet'}`,
      `home ${game && game.home ? game.home.toFixed(1) : '-'} | canvas ${r.scene.w}x${r.scene.h} @${r.scene.dpr} | window ${window.innerWidth}x${window.innerHeight}`,
      lastError ? `error: ${lastError}` : 'no errors',
    ].join('\n');
  };
  window.addEventListener('error', (e) => {
    lastError = `${e.message || 'error'}${e.lineno ? ` @${e.lineno}` : ''}`;
  });
  window.addEventListener('unhandledrejection', (e) => {
    lastError = String((e.reason && e.reason.message) || e.reason || 'rejected promise');
  });

  const frame = (now) => {
    requestAnimationFrame(frame);
    const dt = Util.clamp((now - lastFrame) / 1000, 0, 0.1);
    lastFrame = now;
    step(dt);
    render();
    if (readout) report(now);
  };

  // ---- playing without a mic: a finger's height on the screen is the pitch
  const aim = (e) => {
    const y = e.clientY - stage.getBoundingClientRect().top;
    finger.st = Math.min(Notes.AXIS_HI - 0.01, Notes.AXIS_LO + Art.touchT(r.scene, y) * SPAN);
  };
  stage.addEventListener('pointerdown', (e) => {
    if (mode !== 'touch') return;
    finger.down = true;
    touched = true;
    aim(e);
    try {
      stage.setPointerCapture(e.pointerId);
    } catch (err) {
      // Capture is a nicety: without it a drag that leaves the window just ends.
    }
  });
  stage.addEventListener('pointermove', (e) => {
    if (finger.down) aim(e);
  });
  for (const type of ['pointerup', 'pointercancel']) {
    stage.addEventListener(type, () => {
      finger.down = false;
    });
  }
  window.addEventListener('keydown', (e) => {
    if (mode !== 'touch') return;
    if (e.code === 'Space') {
      finger.key = true;
      touched = true;
    } else if (e.code === 'ArrowUp') {
      finger.slide = 1;
    } else if (e.code === 'ArrowDown') {
      finger.slide = -1;
    } else {
      return;
    }
    if (e.target === document.body || e.target === stage) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') finger.key = false;
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') finger.slide = 0;
  });

  $('start').addEventListener('click', () => begin(true));
  $('nomic').addEventListener('click', () => begin(false));
  $('escape').addEventListener('click', () => begin(false));
  $('again').addEventListener('click', () => newNight(mode));

  // Any tap or key wakes paused sound. A phone only allows that from a gesture.
  for (const type of ['pointerdown', 'touchend', 'keydown']) {
    document.addEventListener(type, () => {
      if (Sound.asleep()) Sound.wake();
    }, true);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    Sound.wake();
    lastFrame = performance.now();
  });

  // The scene and the words share one unit, s. A phone's browser bars resize
  // the page in bursts, so the rebuild waits for them to settle.
  const fit = () => {
    r.resize();
    document.documentElement.style.setProperty('--s', `${r.scene.s}px`);
  };
  let fitTimer = 0;
  const refit = () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fit, 120);
  };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

  // ---- for tests
  window.__nighthum = {
    Sound,
    get game() {
      return game;
    },
    state() {
      const shown = (id) => ($(id).hidden ? null : $(id).textContent);
      return {
        mode,
        state: game ? game.state : 'title',
        home: game ? game.home : null,
        score: game ? game.score : 0,
        voiced: input.voiced,
        freq: input.freq,
        st: game ? game.light.st : 0,
        prompt: shown('prompt'),
        sub: shown('sub'),
        hint: game ? game.hint : null,
        energy: game ? game.energy : 0,
        calves: game ? game.calves.map((c) => ({ offset: c.offset, progress: c.progress, state: c.state })) : [],
      };
    },
    // hz above 0 hums, 0 is silence, null hands the input back to the mic or finger.
    feed(hz, level = 0.1) {
      override = hz === null ? undefined : hz > 0 ? { voiced: true, freq: hz, level, clarity: 1 } : SILENT;
    },
    step(dt, n = 1) {
      for (let i = 0; i < n; i++) step(dt);
    },
    render,
    seed(n) {
      seed = n;
    },
    fit,
  };

  r.seed = seed;
  fit();
  lastFrame = performance.now();
  requestAnimationFrame(frame);
})();

})();
</script>
</body>
</html>
